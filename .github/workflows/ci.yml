name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Validate manifest and assets
        run: node tests/validate-plugin.mjs

      - name: Install Plugin Scanner
        run: python3 -m pip install --user "plugin-scanner[cisco]==3.58.0"

      - name: Scan plugin package
        run: |
          plugin-scanner scan . \
            --format json \
            --cisco-skill-scan auto \
            --min-score 95 \
            --fail-on-severity medium
